<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <title>Gallery — Emily Breedlove</title>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        megina: ['Megina', 'serif'],
                        garamond: ['"EB Garamond"', 'serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#CEC2E0] text-[#4F2972] pt-2 md:pt-28">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full bg-[#CEC2E0] px-4 md:px-8 py-4 md:py-6 flex items-center gap-4 z-50 border-b border-white">
        <a href="/">
            <img src="{{url_for('static', filename='images/Emilylogo.png') }}" alt="Emily Breedlove Logo" class="w-12 h-12 md:w-20 md:h-20 rounded-full" style="mix-blend-mode: multiply;">
        </a>

        <nav class="ml-auto flex gap-4 md:gap-8">
            <a href="/about" class="text-sm md:text-xl font-megina tracking-widest uppercase hover:text-[#4A2880] transition-colors">About</a>
            <a href="/Gallery" class="text-sm md:text-xl font-megina tracking-widest uppercase hover:text-[#4A2880] transition-colors">Gallery</a>
            <a href="/Photography" class="text-sm md:text-xl font-megina tracking-widest uppercase hover:text-[#4A2880] transition-colors">Photography</a>
            <a href="{{ url_for('static', filename='images/EmResume.png') }}" target="_blank" class="text-sm md:text-xl font-megina tracking-widest uppercase hover:text-[#4A2880] transition-colors">Resume</a>
        </nav>
    </header>

    <div class="px-4 md:px-8 pt-20 pb-8 text-center">
        <h2 class="text-2xl md:text-5xl font-megina">GALLERY</h2>
    </div>

    <!-- PHOTOGRAPHY SECTION -->
    <div class="px-4 md:px-8 pb-16 grid grid-cols-1 md:grid-cols-2 gap-2 md:gap-6 min-h-screen">

        <!-- LIGHTING STAIRCASE-->
        <div class="gallery-item group relative mb-6 overflow-hidden" data-aos="fade-up">
            <img src="{{ url_for('static', filename='images/designhistproj/page3square.jpeg') }}" alt="Design History Book" class="w-full object-contain bg-[#CEC2E0] transition-transform duration-300 group-hover:scale-105">
            <div class="absolute inset-0 flex items-center justify-center bg-[#4F2972]/0 group-hover:bg-[#4F2972]/50 transition-colors duration-300">
                <p class="text-white text-sm md:text-lg font-garamond tracking-widest uppercase text-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 px-4">Design History Book</p>
            </div>
        </div>

        <!-- STAIRCASE -->
        <div class="gallery-item group relative mb-6 overflow-hidden" data-aos="fade-up">
            <img src="{{ url_for('static', filename='images/Typoposterproj/typeposterdquare.jpeg') }}" alt="Typography Design Poster" class="w-full object-contain bg-[#CEC2E0] transition-transform duration-300 group-hover:scale-105">
            <div class="absolute inset-0 flex items-center justify-center bg-[#4F2972]/0 group-hover:bg-[#4F2972]/50 transition-colors duration-300">
                <p class="text-white text-sm md:text-lg font-garamond tracking-widest uppercase text-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 px-4">Typography Design Poster</p>
            </div>
        </div>

        <!-- FISHY -->
        <div class="gallery-item group relative mb-6 overflow-hidden" data-aos="fade-up">
            <img src="{{ url_for('static', filename='images/MoviepProj/moviepostersquare.jpeg') }}" alt="Surreal Movie Poster" class="w-full object-contain bg-[#CEC2E0] transition-transform duration-300 group-hover:scale-105">
            <div class="absolute inset-0 flex items-center justify-center bg-[#4F2972]/0 group-hover:bg-[#4F2972]/50 transition-colors duration-300">
                <p class="text-white text-sm md:text-lg font-garamond tracking-widest uppercase text-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 px-4">Surreal Movie Poster</p>
            </div>
        </div>

        <!-- CHARLIELIGHT-->
        <div class="gallery-item group relative mb-6 overflow-hidden" data-aos="fade-up">
            <img src="{{ url_for('static', filename='images/clairoproj/clairosquare.jpeg') }}" alt="Magazine Cover and Spread Design" class="w-full object-contain bg-[#CEC2E0] transition-transform duration-300 group-hover:scale-105">
            <div class="absolute inset-0 flex items-center justify-center bg-[#4F2972]/0 group-hover:bg-[#4F2972]/50 transition-colors duration-300">
                <p class="text-white text-sm md:text-lg font-garamond tracking-widest uppercase text-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 px-4">Magazine Cover and Spread Design</p>
            </div>
        </div>

        <!-- SUN-->
        <div class="gallery-item group relative mb-6 overflow-hidden" data-aos="fade-up">
            <img src="{{ url_for('static', filename='images/snakeproj/snakesquare.jpeg') }}" alt="Symbol and Logotype" class="w-full object-contain bg-[#CEC2E0] transition-transform duration-300 group-hover:scale-105">
            <div class="absolute inset-0 flex items-center justify-center bg-[#4F2972]/0 group-hover:bg-[#4F2972]/50 transition-colors duration-300">
                <p class="text-white text-sm md:text-lg font-garamond tracking-widest uppercase text-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 px-4">Symbol and Logotype</p>
            </div>
        </div>

        <!-- WINDOW -->
        <div class="gallery-item group relative mb-6 overflow-hidden" data-aos="fade-up">
            <img src="{{ url_for('static', filename='images/photography/window.png') }}" alt="Window Scene, May 2026" class="w-full object-contain bg-[#CEC2E0] transition-transform duration-300 group-hover:scale-105">
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full border-t border-white bg-[#CEC2E0] px-4 md:px-8 py-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div class="flex flex-col gap-1">
            <p class="text-sm md:text-lg font-megina tracking-widest">emilybreedlove.design@gmail.com</p>
            <a href="https://www.linkedin.com/in/emily-breedlove-989a7b28a/" target="_blank" class="text-sm md:text-md font-garamond tracking-widest uppercase underline hover:text-[#4A2880] transition-colors">LinkedIn</a>
            <p class="text-sm md:text-lg font-megina tracking-widest uppercase font-[#4F2972]">© 2026 Emily Breedlove</p>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true
        });
    </script>

    <script>
    // Header hide/show on scroll
    let lastScroll = 0;
    const header = document.querySelector('header');

    window.addEventListener('scroll', () => {
        const currentScroll = window.scrollY;

        if (currentScroll > lastScroll && currentScroll > 80) {
            header.style.transform = 'translateY(-100%)';
            header.style.transition = 'transform 0.3s ease';
        } else {
            header.style.transform = 'translateY(0)';
            header.style.transition = 'transform 0.3s ease';
        }

        lastScroll = currentScroll;
    });
    </script>


</body>
</html>
